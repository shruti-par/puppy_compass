{% extends "base.html" %}

<!-- Load the Fraunces display font (used for headings via extra.css).
     Nunito Sans + JetBrains Mono are loaded automatically by Material
     from the font.text / font.code settings in mkdocs.yml. -->
{% block extrahead %}
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&display=swap">
  <meta name="theme-color" content="#3f7d6e">
{% endblock %}
